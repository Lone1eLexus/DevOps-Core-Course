apiVersion: v1
kind: Pod
metadata:
  name: init-download-pod
spec:
  initContainers:
    - name: downloader
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Downloading index.html..."
          wget -O /work-dir/index.html https://example.com
          echo "Download complete."
      volumeMounts:
        - name: shared-data
          mountPath: /work-dir
  containers:
    - name: main-app
      image: busybox:1.36
      command: ["sh", "-c", "cat /data/index.html && sleep 3600"]
      volumeMounts:
        - name: shared-data
          mountPath: /data
  volumes:
    - name: shared-data
      emptyDir: {}