apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info-service.fullname" . }}-post-install"
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      name: "{{ include "devops-info-service.fullname" . }}-post-install"
    spec:
      restartPolicy: Never
      containers:
      - name: post-install-test
        image: curlimages/curl:latest
        command:
          - sh
          - -c
          - |
            echo "Post-install: Waiting for application to be ready..."
            SERVICE_NAME="{{ include "devops-info-service.fullname" . }}"
            SERVICE_PORT="{{ .Values.service.port }}"
            URL="http://$SERVICE_NAME:$SERVICE_PORT/health"
            echo "Checking $URL"
            for i in 1 2 3 4 5; do
              if curl -f -s -o /dev/null "$URL"; then
                echo "Application is ready!"
                exit 0
              fi
              echo "Attempt $i failed, sleeping..."
              sleep 5
            done
            echo "Application did not become ready in time."
            exit 1