apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.fullname" . }}-env
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.environment | default "development" | quote }}
  LOG_LEVEL: {{ .Values.logLevel | default "info" | quote }}
  CACHE_TTL: {{ .Values.cacheTTL | default "3600" | quote }}
  FEATURE_DEBUG: {{ .Values.featureDebug | default "false" | quote }}