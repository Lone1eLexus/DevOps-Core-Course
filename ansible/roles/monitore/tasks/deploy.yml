---
- name: Deploy observability stack with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ observability_dir }}"
    state: present
    pull: always
  register: compose_result

- name: Wait for services to be healthy (basic port checks)
  wait_for:
    port: "{{ item }}"
    host: "{{ ansible_default_ipv4.address }}"
    delay: 5
    timeout: 60
  loop:
    - "{{ loki_port }}"
    - "{{ grafana_port }}"
    - "{{ prometheus_port }}"